type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: Trabalho 2 - API Prisma PostgreSQL
meta:
  id: wrk_trabalho2_prisma
  description: Coleção com os fluxos principais da persistência.
collection:
  - name: Saúde e documentação
    meta: { id: fld_docs, description: "" }
    children:
      - url: "{{ _.base_url }}/health"
        name: Health
        method: GET
      - url: "{{ _.base_url }}/docs"
        name: Swagger
        method: GET
  - name: Estudantes
    meta: { id: fld_students, description: "" }
    children:
      - url: "{{ _.base_url }}/api/v1/estudantes?page=1&limit=10&ordenar=nome&direcao=asc"
        name: Listar com paginação e ordenação
        method: GET
      - url: "{{ _.base_url }}/api/v1/estudantes/{{ _.student_id }}"
        name: Buscar com matrículas e empréstimos
        method: GET
      - url: "{{ _.base_url }}/api/v1/estudantes"
        name: Criar estudante
        method: POST
        headers: [{ name: Content-Type, value: application/json }]
        body: { mimeType: application/json, text: '{"nome":"Novo Estudante","email":"novo@exemplo.com"}' }
  - name: Cursos e matrículas
    meta: { id: fld_courses, description: "" }
    children:
      - url: "{{ _.base_url }}/api/v1/cursos?ordenar=nome&direcao=asc"
        name: Listar cursos
        method: GET
      - url: "{{ _.base_url }}/api/v1/estudantes/{{ _.student_id }}/matriculas"
        name: Matrículas do estudante
        method: GET
      - url: "{{ _.base_url }}/api/v1/estudantes/{{ _.student_id }}/matriculas"
        name: Criar matrícula
        method: POST
        headers: [{ name: Content-Type, value: application/json }]
        body: { mimeType: application/json, text: '{"cursoId":"{{ _.course_id }}"}' }
  - name: Livros e categorias
    meta: { id: fld_books, description: "" }
    children:
      - url: "{{ _.base_url }}/api/v1/livros?titulo=Livro&ordenar=titulo&direcao=asc"
        name: Listar livros relacionados
        method: GET
      - url: "{{ _.base_url }}/api/v1/categorias"
        name: Listar categorias relacionadas
        method: GET
      - url: "{{ _.base_url }}/api/v1/categorias/{{ _.category_id }}/livros"
        name: Vincular livro à categoria
        method: POST
        headers: [{ name: Content-Type, value: application/json }]
        body: { mimeType: application/json, text: '{"livroId":"{{ _.book_id }}"}' }
  - name: Empréstimos transacionais
    meta: { id: fld_loans, description: "" }
    children:
      - url: "{{ _.base_url }}/api/v1/emprestimos?ativo=true&ordenar=data&direcao=desc"
        name: Listar empréstimos ativos
        method: GET
      - url: "{{ _.base_url }}/api/v1/emprestimos"
        name: Criar empréstimo
        method: POST
        headers: [{ name: Content-Type, value: application/json }]
        body: { mimeType: application/json, text: '{"estudanteId":"{{ _.student_id }}","livroId":"{{ _.book_id }}"}' }
      - url: "{{ _.base_url }}/api/v1/emprestimos/{{ _.loan_id }}/devolucao"
        name: Devolver empréstimo
        method: POST

environments:
  name: Base Environment
  data:
    base_url: http://localhost:3000
    student_id: substitua-pelo-id-do-seed
    course_id: substitua-pelo-id-do-seed
    book_id: substitua-pelo-id-do-seed
    category_id: substitua-pelo-id-do-seed
    loan_id: substitua-pelo-id-do-emprestimo
