services:
  - type: web
    name: trabalho4-api-rest
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://projetoanimacao03-coder.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: trabalho4-postgres
          property: connectionString

databases:
  - name: trabalho4-postgres
    databaseName: trabalho4
    user: trabalho4
    plan: free
    postgresMajorVersion: "16"
